<form
	class="tresdetv sheet actor {{actor.type}} flexcol"
	autocomplete="off"
>
	<header class="sheet-header">
		<div class="portrait">
			<img
				class="profile-img"
				src="{{actor.img}}"
				data-edit="img"
				title="{{actor.name}}"
			/>
		</div>

		<div class="header-fields">
			<h1 class="charname">
				<input
					name="name"
					type="text"
					value="{{actor.name}}"
					placeholder="{{localize 'Name'}}"
				/>
			</h1>
		</div>
	</header>

	<section class="sheet-body">
		<div
			class="tab biography active"
			data-group="limited"
			data-tab="description"
		>
			{{editor
				system.descricao
				target="system.descricao"
				button=true
				editable=editable
				engine="prosemirror"
				collaborate=false
			}}
		</div>
	</section>
</form>
